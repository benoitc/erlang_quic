services:
  quic-server:
    build:
      context: .
      dockerfile: Dockerfile.quic-server
    ports:
      - "4433:4433/udp"
    volumes:
      - ../certs:/certs:ro
      - ./logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "grep -qsi ':1151 ' /proc/net/udp /proc/net/udp6"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "quic_server.py", "--host", "0.0.0.0", "--port", "4433",
              "--cert", "/certs/cert.pem", "--key", "/certs/priv.key",
              "--secrets-log", "/logs/sslkeys.log", "-v"]
    restart: unless-stopped

  # HTTP/3 server for E2E testing (serves files from /www)
  h3-server:
    build:
      context: .
      dockerfile: Dockerfile.quic-server
    ports:
      - "4435:4435/udp"
    volumes:
      - ../certs:/certs:ro
      - ./www:/www:ro
      - ./logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "grep -qsi ':1153 ' /proc/net/udp /proc/net/udp6"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - PYTHONUNBUFFERED=1
      - H3_SERVER_PORT=4435
    command: ["python", "quic_h3_server.py", "--host", "0.0.0.0", "--port", "4435",
              "--cert", "/certs/cert.pem", "--key", "/certs/priv.key",
              "--document-root", "/www",
              "--secrets-log", "/logs/h3_sslkeys.log", "-v"]
    restart: unless-stopped

  # HTTP/3 server with push support for E2E testing
  h3-push-server:
    build:
      context: .
      dockerfile: Dockerfile.quic-server
    ports:
      - "4436:4436/udp"
    volumes:
      - ../certs:/certs:ro
      - ./www:/www:ro
      - ./logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "grep -qsi ':1154 ' /proc/net/udp /proc/net/udp6"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - PYTHONUNBUFFERED=1
      - H3_PUSH_ENABLED=1
    command: ["python", "quic_h3_server.py", "--host", "0.0.0.0", "--port", "4436",
              "--cert", "/certs/cert.pem", "--key", "/certs/priv.key",
              "--document-root", "/www", "--enable-push",
              "--secrets-log", "/logs/h3_push_sslkeys.log", "-v"]
    restart: unless-stopped

  # aioquic HTTP/3 client for testing our server
  aioquic-h3-client:
    build:
      context: .
      dockerfile: Dockerfile.quic-server
    volumes:
      - ../certs:/certs:ro
      - ./logs:/logs
    entrypoint: ["python", "http3_client.py"]
    network_mode: host
    profiles:
      - tools

  # quic-go HTTP/3 server whose /goaway path drains the connection
  quic-go-h3-goaway:
    build:
      context: ./go-h3
      dockerfile: Dockerfile
    ports:
      - "4440:4440/udp"
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -qsi ':1158 ' /proc/net/udp /proc/net/udp6"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # quic-go HTTP/3 client for testing our server
  quic-go-h3-client:
    build:
      context: ./go-h3
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/goaway-h3", "client"]
    network_mode: host
    profiles:
      - tools

  # quiche HTTP/3 server that sends GOAWAY on the first request
  quiche-h3-goaway:
    build:
      context: ./quiche-h3
      dockerfile: Dockerfile
    ports:
      - "4441:4441/udp"
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -qsi ':1159 ' /proc/net/udp /proc/net/udp6"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # quiche HTTP/3 client that answers a GOAWAY with its own
  quiche-h3-client:
    build:
      context: ./quiche-h3
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/quiche-h3-client"]
    network_mode: host
    profiles:
      - tools

  quic-go-server:
    build:
      context: .
      dockerfile: Dockerfile.quic-go
    ports:
      - "4434:4434/udp"
    volumes:
      - ../certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -qsi ':1152 ' /proc/net/udp /proc/net/udp6"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
