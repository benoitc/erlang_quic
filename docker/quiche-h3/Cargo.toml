[package]
name = "quiche-h3-goaway"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "quiche-h3-server"
path = "src/bin/server.rs"

[[bin]]
name = "quiche-h3-client"
path = "src/bin/client.rs"

[dependencies]
quiche = "0.30"
ring = "0.17"
log = "0.4"
env_logger = "0.11"
mio = { version = "1.0", features = ["net", "os-poll"] }
