name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit Tests OTP ${{ matrix.otp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            otp: '26'
            rebar3: '3.24.0'
          - os: ubuntu-22.04
            otp: '27'
            rebar3: '3.24.0'
          - os: ubuntu-24.04
            otp: '27'
            rebar3: '3.24.0'
          - os: ubuntu-24.04
            otp: '28'
            rebar3: 'nightly'
          - os: ubuntu-24.04
            otp: '29'
            rebar3: 'nightly'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-mix-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ matrix.otp }}-mix-

      - name: Compile
        run: rebar3 compile

      # The NIF is opt-in. Runners have cmake installed, so this fails if a
      # plain compile ever starts building it again.
      - name: Assert the NIF is not built by default
        run: |
          test ! -e priv/quic_crypto_nif.so || { echo "NIF built without QUIC_BUILD_NIF=1"; exit 1; }
          rebar3 as test compile
          erl -noshell -pa _build/test/lib/quic/ebin -eval '
            application:ensure_all_started(quic),
            case quic_crypto_nif:is_loaded() of
              false -> halt(0);
              true -> io:format("NIF loaded without QUIC_BUILD_NIF=1~n"), halt(1)
            end.'

      - name: Run unit tests
        run: rebar3 eunit

      - name: Run property tests
        run: rebar3 proper

  macos:
    name: macOS
    needs: unit-tests
    runs-on: macos-15
    env:
      QUIC_BUILD_NIF: "1"

    steps:
      - uses: actions/checkout@v4

      # brew ships the current OTP; the point of this job is the
      # platform, not the OTP matrix, which the Linux jobs cover.
      - name: Set up Erlang
        run: brew install erlang rebar3

      - name: Compile
        run: rebar3 compile

      # CMake has to find the libcrypto brew's OTP is linked against and
      # emit the Mach-O bundle flags. A silent skip here would leave the
      # macOS build untested, so fail instead.
      - name: Assert the NIF built and loaded
        run: |
          test -f priv/quic_crypto_nif.so || { echo "NIF was not built"; exit 1; }
          rebar3 as test compile
          erl -noshell -pa _build/test/lib/quic/ebin -eval '
            application:ensure_all_started(quic),
            case quic_crypto_nif:is_loaded() of
              true -> halt(0);
              false -> io:format("NIF built but not loaded~n"), halt(1)
            end.'

      - name: Run tests with the NIF
        run: rebar3 eunit

      - name: Run tests with the NIF disabled
        env:
          QUIC_DISABLE_CRYPTO_NIF: "1"
        run: rebar3 eunit

  windows:
    name: Windows
    needs: unit-tests
    runs-on: windows-2022
    timeout-minutes: 20
    # Set so a hook that ran would try, and fail, to build the NIF.
    env:
      QUIC_BUILD_NIF: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      # Before checkout: setup-beam runs `rebar3 version`, which hangs
      # fetching the project plugins when it finds our rebar.config.
      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - uses: actions/checkout@v4

      # Git for Windows puts sh on the runner's PATH; users do not have it.
      - name: Remove sh from PATH
        run: |
          $path = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          "PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile
        run: |
          if (Get-Command sh -ErrorAction SilentlyContinue) { throw "sh is still on PATH" }
          $env:DEBUG = "1"
          rebar3 compile

      - name: Assert the app starts on OTP crypto
        run: |
          if (Test-Path priv/quic_crypto_nif.*) { throw "NIF was built" }
          erl -noshell -pa _build/default/lib/quic/ebin -eval "{ok, _} = application:ensure_all_started(quic), false = quic_crypto_nif:is_loaded(), halt(0)."

      - name: Clean
        run: rebar3 clean

  freebsd:
    name: FreeBSD
    needs: unit-tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          # The stock erlang pkg lags behind; the versioned runtime
          # package tracks a supported OTP. cmake builds the NIF.
          prepare: |
            pkg install -y erlang-runtime28 cmake
          run: |
            # erlang-runtime28 installs outside the default PATH.
            ERL_BIN="$(dirname "$(pkg info -l erlang-runtime28 | tr -d '[:blank:]' | grep -E '/bin/erl$' | grep -v 'erts-' | head -1)")"
            export PATH="$ERL_BIN:/usr/local/bin:$PATH"
            erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().'

            fetch -q https://github.com/erlang/rebar3/releases/download/3.25.0/rebar3 -o rebar3
            chmod +x rebar3

            export QUIC_BUILD_NIF=1
            ./rebar3 compile

            # The FreeBSD compile hook runs c_src/build_nif.sh; a skipped
            # build would silently drop the NIF coverage.
            test -f priv/quic_crypto_nif.so || { echo "NIF was not built"; exit 1; }
            ./rebar3 as test compile
            erl -noshell -pa _build/test/lib/quic/ebin -eval '
              application:ensure_all_started(quic),
              case quic_crypto_nif:is_loaded() of
                true -> halt(0);
                false -> io:format("NIF built but not loaded~n"), halt(1)
              end.'

            ./rebar3 eunit
            QUIC_DISABLE_CRYPTO_NIF=1 ./rebar3 eunit

  e2e:
    name: E2E Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-e2e-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      - name: Run E2E tests
        run: rebar3 ct --suite=quic_e2e_SUITE,quic_trusted_network_SUITE,quic_cid_rotation_SUITE

      # The current OTP 28 release has the ML-KEM APIs (introduced in 28.1).
      - name: Run PQC tests
        run: rebar3 ct --suite=quic_pqc_e2e_SUITE,quic_pqc_mtu_SUITE

  server-batching-gso:
    name: Server Batching + Linux GSO
    needs: unit-tests
    # Pinned to ubuntu-24.04 (kernel 6.x) so UDP_SEGMENT / GSO is
    # guaranteed available; the suite hard-fails when GSO is expected
    # but missing, so we must not let the runner label drift onto a
    # kernel without UDP GSO support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-batching-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-batching-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      - name: Run batching CT suite (with GSO)
        env:
          QUIC_ENABLE_GSO_TEST: "1"
        run: rebar3 ct --suite=quic_server_batching_SUITE

  bulk-send:
    name: Bulk Send + Socket Backend
    needs: unit-tests
    # The socket-backend cases need GRO and per-message GSO, so they run
    # here rather than on the macOS job. docker/run-ct.sh gives the same
    # coverage from a non-Linux host.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-bulk-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-bulk-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      # The harness asks for buffers the stock runner clamps, which would
      # measure the host rather than the code.
      - name: Raise socket buffer limits
        run: sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216

      - name: Run the bulk send suite
        run: rebar3 ct --suite=quic_bulk_run_send_SUITE

  common-test:
    name: Common Test (all suites)
    needs: unit-tests
    # Every suite, so a new one is covered without being added to a list:
    # most were in none, and three distribution suites had never run at
    # all. The other jobs keep what needs its own environment, such as the
    # external peers and forced GSO; here those cases skip.
    runs-on: ubuntu-24.04
    steps:
      # The QPACK interop suite reads the qifs submodule, and skips
      # without it.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-ct-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-ct-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      # The regression and socket-backend suites ask for buffers the stock
      # runner clamps, which would measure the host rather than the code.
      - name: Raise socket buffer limits
        run: sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216

      - name: Run every suite
        run: rebar3 ct

  crypto-nif:
    name: Crypto NIF
    needs: unit-tests
    runs-on: ubuntu-24.04
    env:
      QUIC_BUILD_NIF: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: Compile
        run: rebar3 compile

      # The NIF tests skip themselves when it is not loaded, so a green
      # run proves nothing unless the build is known to have produced
      # it. Fail loudly here instead.
      - name: Assert the NIF is loaded
        run: |
          test -f priv/quic_crypto_nif.so || { echo "NIF was not built"; exit 1; }
          rebar3 as test compile
          erl -noshell -pa _build/test/lib/quic/ebin -eval '
            application:ensure_all_started(quic),
            case quic_crypto_nif:is_loaded() of
              true -> halt(0);
              false -> io:format("NIF built but not loaded~n"), halt(1)
            end.'

      - name: Run tests with the NIF
        run: rebar3 eunit

      - name: Run tests with the NIF disabled
        env:
          QUIC_DISABLE_CRYPTO_NIF: "1"
        run: rebar3 eunit

  crypto-nif-fuzz:
    name: Crypto NIF Fuzz (ASan)
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      # Compile without QUIC_BUILD_NIF so the ASan build below is the only
      # NIF in priv/.
      - name: Compile
        run: rebar3 as test compile

      - name: Rebuild the NIF with AddressSanitizer
        run: |
          rm -rf c_src/build priv/quic_crypto_nif.so
          cmake -S c_src -B c_src/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address"
          cmake --build c_src/build
          test -f priv/quic_crypto_nif.so || { echo "NIF was not built"; exit 1; }

      # open_run parses frames in C from plaintext the peer controls, so
      # this is the one place attacker input reaches a hand-written
      # parser. ASan aborts the emulator on a finding, which fails the
      # step. Leak detection is off: the BEAM is not leak-clean and its
      # allocations are not what is under test.
      - name: Fuzz the in-NIF frame parser
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          erlc -o _build/test/lib/quic/test test/quic_nif_fuzz.erl
          # One cipher per emulator so an ASan abort names the cipher.
          # ChaCha reaches the fused paths now, including its own C
          # header-protection routine; the harness answers
          # {error, nothing_exercised} for a cipher that does not, so
          # one that silently stops being covered fails here.
          for CIPHER in aes_128_gcm aes_256_gcm chacha20_poly1305; do
            LD_PRELOAD=$(gcc -print-file-name=libasan.so) \
              erl -noshell -pa _build/test/lib/quic/ebin -pa _build/test/lib/quic/test -eval "
                application:ensure_all_started(quic),
                case quic_crypto_nif:is_loaded() of
                  false -> io:format(\"NIF not loaded, nothing fuzzed~n\"), halt(1);
                  true ->
                    case quic_nif_fuzz:run(200000, 1, $CIPHER) of
                      ok -> halt(0);
                      {error, R} -> io:format(\"$CIPHER: ~p~n\", [R]), halt(1)
                    end
                end."
          done

  regression:
    name: Performance Regression
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      # The harness asks for a 7 MB socket buffer and the kernel clamps it
      # to rmem_max, 212992 on a stock runner, where loopback overflows and
      # the gate would measure the host instead of the code.
      - name: Raise socket buffer limits
        run: sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216

      # Asserts packet and retransmit counters, never a rate, so it does
      # not flake on a loaded runner. The socket-backend cases need
      # Linux, which is why this job is pinned rather than run on the
      # macOS one.
      - name: Run the regression gate
        run: rebar3 ct --suite=quic_regression_SUITE

  dist:
    name: Distribution Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-dist-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-dist-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      # These boot real VMs and speak dist over QUIC, which nothing else
      # covers: the simultaneous-connect deadlock lived here undetected.
      # The Common Test job runs the other distribution suites.
      - name: Run distribution tests
        run: rebar3 ct --suite=quic_dist_psk_SUITE,quic_dist_simultaneous_connect_SUITE,quic_dist_auth_SUITE

  h3-e2e:
    name: HTTP/3 E2E Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-h3-e2e-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-h3-e2e-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      - name: Run H3 E2E tests
        run: rebar3 ct --suite=quic_h3_e2e_SUITE

  interop:
    name: Interop Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-interop-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-interop-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Build Docker images
        run: docker compose -f docker/docker-compose.yml build

      # Every service must be healthy, not just the first one to come up.
      - name: Start QUIC servers
        run: |
          docker compose -f docker/docker-compose.yml up -d
          for i in $(seq 1 30); do
            waiting=$(docker compose -f docker/docker-compose.yml ps --format '{{.Service}} {{.Health}}' | grep -v ' healthy$' || true)
            if [ -z "$waiting" ]; then
              echo "All servers healthy"
              exit 0
            fi
            echo "Waiting for: $waiting ($i/30)"
            sleep 2
          done
          docker compose -f docker/docker-compose.yml ps
          exit 1

      - name: Compile
        run: rebar3 compile

      - name: Run Interop tests
        run: rebar3 ct --suite=quic_interop_SUITE,quic_interop_stream_reset_SUITE
        env:
          QUIC_AIOQUIC_HOST: 127.0.0.1
          QUIC_AIOQUIC_PORT: 4433
          QUIC_AIOQUIC_H3_PORT: 4435
          QUIC_QUICGO_HOST: 127.0.0.1
          QUIC_QUICGO_PORT: 4434

      - name: Run client compliance and stream reassembly tests
        run: rebar3 ct --suite=quic_client_compliance_SUITE,quic_stream_reassembly_SUITE

      # The h3-server on 4435 issues session tickets; 4433 does not.
      - name: Run 0-RTT tests against external peers
        run: rebar3 ct --suite=quic_h3_0rtt_SUITE
        env:
          QUIC_AIOQUIC_HOST: 127.0.0.1
          QUIC_AIOQUIC_PORT: 4435
          QUIC_QUICGO_HOST: 127.0.0.1
          QUIC_QUICGO_PORT: 4434

      - name: Collect server logs
        if: failure()
        run: |
          echo "=== QUIC Server Logs (aioquic) ==="
          docker compose -f docker/docker-compose.yml logs quic-server
          echo "=== HTTP/3 Server Logs (aioquic) ==="
          docker compose -f docker/docker-compose.yml logs h3-server
          echo "=== QUIC Server Logs (quic-go) ==="
          docker compose -f docker/docker-compose.yml logs quic-go-server || true

      - name: Stop QUIC servers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: |
            _build/*_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-plt-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp28-

      - name: Run Dialyzer
        run: rebar3 dialyzer

  xref:
    name: XRef
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - name: Run XRef
        run: rebar3 xref

  format:
    name: erlfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - name: Run erlfmt check
        run: rebar3 fmt --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      # edoc stops on a malformed doc comment and ex_doc exits non-zero,
      # which none of the other jobs would notice.
      - name: Build docs
        run: rebar3 ex_doc

  lint:
    name: Elvis lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - name: Run elvis lint
        run: rebar3 lint
