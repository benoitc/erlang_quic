name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit Tests OTP ${{ matrix.otp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            otp: '26'
            rebar3: '3.24.0'
          - os: ubuntu-22.04
            otp: '27'
            rebar3: '3.24.0'
          - os: ubuntu-24.04
            otp: '27'
            rebar3: '3.24.0'
          - os: ubuntu-24.04
            otp: '28'
            rebar3: 'nightly'
          - os: ubuntu-24.04
            otp: '29'
            rebar3: 'nightly'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-mix-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ matrix.otp }}-mix-

      - name: Compile
        run: rebar3 compile

      - name: Run unit tests
        run: rebar3 eunit

      - name: Run property tests
        run: rebar3 proper

  macos:
    name: macOS
    needs: unit-tests
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # brew ships the current OTP; the point of this job is the
      # platform, not the OTP matrix, which the Linux jobs cover.
      - name: Set up Erlang
        run: brew install erlang rebar3

      - name: Compile
        run: rebar3 compile

      # CMake has to find the libcrypto brew's OTP is linked against and
      # emit the Mach-O bundle flags. A silent skip here would leave the
      # macOS build untested, so fail instead.
      - name: Assert the NIF built and loaded
        run: |
          test -f priv/quic_crypto_nif.so || { echo "NIF was not built"; exit 1; }
          rebar3 as test compile
          erl -noshell -pa _build/test/lib/quic/ebin -eval '
            application:ensure_all_started(quic),
            case quic_crypto_nif:is_loaded() of
              true -> halt(0);
              false -> io:format("NIF built but not loaded~n"), halt(1)
            end.'

      - name: Run tests with the NIF
        run: rebar3 eunit

      - name: Run tests with the NIF disabled
        env:
          QUIC_DISABLE_CRYPTO_NIF: "1"
        run: rebar3 eunit

  freebsd:
    name: FreeBSD
    needs: unit-tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          # The stock erlang pkg lags behind; the versioned runtime
          # package tracks a supported OTP. cmake builds the NIF.
          prepare: |
            pkg install -y erlang-runtime28 cmake
          run: |
            # erlang-runtime28 installs outside the default PATH.
            ERL_BIN="$(dirname "$(pkg info -l erlang-runtime28 | tr -d '[:blank:]' | grep -E '/bin/erl$' | grep -v 'erts-' | head -1)")"
            export PATH="$ERL_BIN:/usr/local/bin:$PATH"
            erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().'

            fetch -q https://github.com/erlang/rebar3/releases/download/3.25.0/rebar3 -o rebar3
            chmod +x rebar3

            ./rebar3 compile

            # bmake runs c_src/Makefile, which delegates to CMake; a
            # skipped build would silently drop the NIF coverage.
            test -f priv/quic_crypto_nif.so || { echo "NIF was not built"; exit 1; }
            ./rebar3 as test compile
            erl -noshell -pa _build/test/lib/quic/ebin -eval '
              application:ensure_all_started(quic),
              case quic_crypto_nif:is_loaded() of
                true -> halt(0);
                false -> io:format("NIF built but not loaded~n"), halt(1)
              end.'

            ./rebar3 eunit
            QUIC_DISABLE_CRYPTO_NIF=1 ./rebar3 eunit

  e2e:
    name: E2E Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-e2e-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      - name: Run E2E tests
        run: rebar3 ct --suite=quic_e2e_SUITE,quic_trusted_network_SUITE

      # The current OTP 28 release has the ML-KEM APIs (introduced in 28.1).
      - name: Run PQC tests
        run: rebar3 ct --suite=quic_pqc_e2e_SUITE,quic_pqc_mtu_SUITE

  server-batching-gso:
    name: Server Batching + Linux GSO
    needs: unit-tests
    # Pinned to ubuntu-24.04 (kernel 6.x) so UDP_SEGMENT / GSO is
    # guaranteed available; the suite hard-fails when GSO is expected
    # but missing, so we must not let the runner label drift onto a
    # kernel without UDP GSO support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-batching-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-batching-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      - name: Run batching CT suite (with GSO)
        env:
          QUIC_ENABLE_GSO_TEST: "1"
        run: rebar3 ct --suite=quic_server_batching_SUITE

  crypto-nif:
    name: Crypto NIF
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: Compile
        run: rebar3 compile

      # The NIF tests skip themselves when it is not loaded, so a green
      # run proves nothing unless the build is known to have produced
      # it. Fail loudly here instead.
      - name: Assert the NIF is loaded
        run: |
          test -f priv/quic_crypto_nif.so || { echo "NIF was not built"; exit 1; }
          rebar3 as test compile
          erl -noshell -pa _build/test/lib/quic/ebin -eval '
            application:ensure_all_started(quic),
            case quic_crypto_nif:is_loaded() of
              true -> halt(0);
              false -> io:format("NIF built but not loaded~n"), halt(1)
            end.'

      - name: Run tests with the NIF
        run: rebar3 eunit

      - name: Run tests with the NIF disabled
        env:
          QUIC_DISABLE_CRYPTO_NIF: "1"
        run: rebar3 eunit

  crypto-nif-fuzz:
    name: Crypto NIF Fuzz (ASan)
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      # Compile first: the rebar pre_hook builds the NIF, and the ASan
      # build below has to be the one left in priv/.
      - name: Compile
        run: rebar3 as test compile

      - name: Rebuild the NIF with AddressSanitizer
        run: |
          rm -rf c_src/build priv/quic_crypto_nif.so
          cmake -S c_src -B c_src/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address"
          cmake --build c_src/build
          test -f priv/quic_crypto_nif.so || { echo "NIF was not built"; exit 1; }

      # open_run parses frames in C from plaintext the peer controls, so
      # this is the one place attacker input reaches a hand-written
      # parser. ASan aborts the emulator on a finding, which fails the
      # step. Leak detection is off: the BEAM is not leak-clean and its
      # allocations are not what is under test.
      - name: Fuzz the in-NIF frame parser
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          erlc -o _build/test/lib/quic/test test/quic_nif_fuzz.erl
          # One cipher per emulator so an ASan abort names the cipher.
          # ChaCha joins this list when it reaches the fused paths; the
          # harness answers {error, nothing_exercised} until then, so a
          # cipher that silently stops being covered fails here.
          for CIPHER in aes_128_gcm aes_256_gcm; do
            LD_PRELOAD=$(gcc -print-file-name=libasan.so) \
              erl -noshell -pa _build/test/lib/quic/ebin -pa _build/test/lib/quic/test -eval "
                application:ensure_all_started(quic),
                case quic_crypto_nif:is_loaded() of
                  false -> io:format(\"NIF not loaded, nothing fuzzed~n\"), halt(1);
                  true ->
                    case quic_nif_fuzz:run(200000, 1, $CIPHER) of
                      ok -> halt(0);
                      {error, R} -> io:format(\"$CIPHER: ~p~n\", [R]), halt(1)
                    end
                end."
          done

  regression:
    name: Performance Regression
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      # Asserts packet and retransmit counters, never a rate, so it does
      # not flake on a loaded runner. The socket-backend cases need
      # Linux, which is why this job is pinned rather than run on the
      # macOS one.
      - name: Run the regression gate
        run: rebar3 ct --suite=quic_regression_SUITE

  dist:
    name: Distribution Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-dist-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-dist-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      # These boot real VMs and speak dist over QUIC, which nothing else
      # covers: the simultaneous-connect deadlock lived here undetected.
      #
      # quic_dist_basic_SUITE is still absent: it could not be verified
      # here because its peers fail to boot on macOS, so add it once
      # someone confirms it runs on Linux.
      - name: Run distribution tests
        run: rebar3 ct --suite=quic_dist_psk_SUITE,quic_dist_simultaneous_connect_SUITE,quic_dist_auth_SUITE

  h3-e2e:
    name: HTTP/3 E2E Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-h3-e2e-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-h3-e2e-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Compile
        run: rebar3 compile

      - name: Run H3 E2E tests
        run: rebar3 ct --suite=quic_h3_e2e_SUITE

  interop:
    name: Interop Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24.0'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-interop-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-interop-otp28-

      - name: Generate certificates
        run: |
          chmod +x ./certs/generate_certs.sh
          ./certs/generate_certs.sh

      - name: Build Docker images
        run: docker compose -f docker/docker-compose.yml build

      - name: Start QUIC servers
        run: |
          docker compose -f docker/docker-compose.yml up -d
          for i in {1..30}; do
            if docker compose -f docker/docker-compose.yml ps | grep -q "healthy"; then
              echo "Servers are healthy"
              break
            fi
            echo "Waiting for servers... ($i/30)"
            sleep 2
          done

      - name: Compile
        run: rebar3 compile

      - name: Run Interop tests
        run: rebar3 ct --suite=quic_interop_SUITE
        env:
          QUIC_AIOQUIC_HOST: 127.0.0.1
          QUIC_AIOQUIC_PORT: 4433
          QUIC_QUICGO_HOST: 127.0.0.1
          QUIC_QUICGO_PORT: 4434

      - name: Collect server logs
        if: failure()
        run: |
          echo "=== QUIC Server Logs (aioquic) ==="
          docker compose -f docker/docker-compose.yml logs quic-server
          echo "=== QUIC Server Logs (quic-go) ==="
          docker compose -f docker/docker-compose.yml logs quic-go-server || true

      - name: Stop QUIC servers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: |
            _build/*_plt
            ~/.cache/rebar3
          key: ${{ runner.os }}-plt-otp28-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp28-

      - name: Run Dialyzer
        run: rebar3 dialyzer

  xref:
    name: XRef
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - name: Run XRef
        run: rebar3 xref

  format:
    name: erlfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - name: Run erlfmt check
        run: rebar3 fmt --check

  lint:
    name: Elvis lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: 'nightly'

      - name: Run elvis lint
        run: rebar3 lint
